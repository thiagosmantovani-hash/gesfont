# Gera os instaladores do GESFONT num Mac do GitHub e publica a versão nas Releases.
# Os apps instalados consultam essas Releases e se atualizam sozinhos.
#
# Para publicar uma versão nova, aumente "version" no package.json (ex.: 2.1.0 para 2.1.1)
# e envie para a branch main. A automação percebe o número novo e publica sozinha.
# Também dá para rodar à mão em Actions > Publicar versão > Run workflow, ou com uma tag v2.1.1.
name: Publicar versão

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: publicar-versao
  cancel-in-progress: false

jobs:
  mac:
    name: Mac (Apple e Intel)
    # Mac Intel do GitHub: fila menor que a dos Macs com chip Apple e gera os dois instaladores.
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Conferir versão
        id: versao
        run: |
          V=$(node -p "require('./package.json').version")
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $V do package.json."
            exit 1
          fi
          if gh release view "v$V" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q false; then
            if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "A versão v$V já está publicada. Nada a fazer: aumente o número em package.json para publicar."
              echo "publicar=nao" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::A versão v$V já foi publicada. Aumente o número em package.json antes de publicar de novo."
            exit 1
          fi
          echo "publicar=sim" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar dependências
        if: steps.versao.outputs.publicar == 'sim'
        run: npm ci

      - name: Gerar instaladores v${{ steps.versao.outputs.versao }}
        if: steps.versao.outputs.publicar == 'sim'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Nada é publicado se uma destas conferências falhar: os apps instalados só recebem
      # versões que abrem e cujo instalador mostra a pasta Aplicativos.
      - name: Conferir instalador e app antes de publicar
        if: steps.versao.outputs.publicar == 'sim'
        run: |
          set -euo pipefail
          V=${{ steps.versao.outputs.versao }}
          ls -la dist
          test -f dist/latest-mac.yml
          shopt -s nullglob
          DMGS=(dist/*.dmg); [ ${#DMGS[@]} -eq 2 ] || { echo "::error::Esperava 2 instaladores .dmg"; exit 1; }
          for DMG in "${DMGS[@]}"; do
            MNT=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG" >/dev/null
            echo "== $DMG"; ls -la "$MNT"
            test -L "$MNT/Applications" || { echo "::error::$DMG sem o atalho para Aplicativos"; hdiutil detach "$MNT"; exit 1; }
            test -f "$MNT/.DS_Store" || { echo "::error::$DMG sem o layout da janela"; hdiutil detach "$MNT"; exit 1; }
            test -d "$MNT/GESFONT.app"
            codesign --verify --deep --strict "$MNT/GESFONT.app"
            test -f "$MNT/GESFONT.app/Contents/Resources/app-update.yml"
            hdiutil detach "$MNT" >/dev/null
          done
          # o Mac do GitHub é Intel: abre a versão Intel e confere se a interface carrega
          APP=$(ls -d dist/mac/GESFONT.app)
          npx @electron/fuses read --app "$APP" || true
          "$APP/Contents/MacOS/GESFONT" --selftest

      - name: Publicar v${{ steps.versao.outputs.versao }} nas Releases
        if: steps.versao.outputs.publicar == 'sim'
        run: |
          set -euo pipefail
          V=${{ steps.versao.outputs.versao }}
          NOTES=build/release-notes.md; [ -f "$NOTES" ] || { echo "GESFONT $V" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          shopt -s nullglob
          FILES=(dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml)
          [ ${#FILES[@]} -ge 5 ] || { echo "::error::Faltam arquivos para publicar"; exit 1; }
          gh release create "v$V" --title "$V" --target "$GITHUB_SHA" --notes-file "$NOTES" --latest "${FILES[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Conferir arquivos publicados
        if: steps.versao.outputs.publicar == 'sim'
        run: |
          V=${{ steps.versao.outputs.versao }}
          gh release view "v$V" --json assets --jq '.assets[].name'
          gh release view "v$V" --json assets --jq '.assets[].name' | grep -q '^latest-mac.yml$'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
